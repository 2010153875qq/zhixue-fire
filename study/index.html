<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f7f3">
  <meta name="description" content="消防设施操作员中级监控学习站，支持章节练习、模拟练习和错题复习。">
  <title>智学消防 · 中级监控刷题</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-go="home" aria-label="智学消防首页"><span class="brand-icon" aria-hidden="true">✦</span><span>智学消防<small>中级监控 · 学习空间</small></span></button>
      <button class="top-link" type="button" data-action="settings">管理<span aria-hidden="true"> ↗</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button data-page="home"><span aria-hidden="true">⌂</span>首页</button>
      <button data-page="practice"><span aria-hidden="true">▤</span>刷题</button>
      <button data-page="exam"><span aria-hidden="true">◷</span>模考</button>
      <button data-page="wrong"><span aria-hidden="true">♡</span>错题</button>
      <button data-page="videos"><span aria-hidden="true">▷</span>课程</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="bank-file" type="file" accept="application/json,.json" hidden>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
