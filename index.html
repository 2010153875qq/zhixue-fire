<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智学消防题库</title>
<style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#687386;--brand:#c92828;--line:#e7eaf0;--ok:#13795b;--warn:#9a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{background:linear-gradient(135deg,#9f1717,#e64b32);color:#fff;padding:28px 18px 24px}header .wrap,main{max-width:980px;margin:auto}.eyebrow{font-size:13px;opacity:.85}h1{margin:4px 0;font-size:30px}header p{margin:4px 0 0;opacity:.9}main{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px #1b27420b}.stat{font-size:26px;font-weight:700}.muted{color:var(--muted);font-size:14px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,.button{border:0;border-radius:10px;padding:10px 14px;background:#eef1f7;color:var(--ink);cursor:pointer;text-decoration:none;font:inherit}button.active,.button.primary{background:var(--brand);color:#fff}button:disabled{opacity:.55;cursor:not-allowed}section{margin-top:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.q{border-top:1px solid var(--line);padding:16px 0}.q:first-child{border-top:0}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:#fff3df;color:var(--warn);margin-right:6px}.answer{margin-top:8px;color:var(--ok)}.empty{text-align:center;padding:28px;color:var(--muted)}footer{max-width:980px;margin:28px auto;padding:0 18px 30px;color:var(--muted);font-size:13px}a{color:inherit}.notice{background:#fff8e8;border:1px solid #f3dba1;border-radius:12px;padding:12px;font-size:14px}</style></head>
<body><header><div class="wrap"><div class="eyebrow">2010153875qq/zhixue-fire · GitHub Pages 初版</div><h1>智学消防题库</h1><p>分类练习、错题回看与视频入口。未核验答案均明确标为“待复核”。</p></div></header>
<main><div class="grid" id="stats"></div><nav id="nav"></nav><section id="content"></section></main>
<footer>题库文件：<a href="data/questions.json">data/questions.json</a> · 批量导入模板：<a href="data/import/questions.template.json">data/import/questions.template.json</a> · <a href="../zhixue/">返回智学综合首页</a></footer>
<script>
const KEY='zhixue_fire_questions',WRONG='zhixue_fire_wrong';const categories=[['all','全部'],['single','单选题'],['multiple','多选题'],['judge','判断题']];let questions=[],wrong=new Set(JSON.parse(localStorage.getItem(WRONG)||'[]')),mode='all';const typeLabel={single:'单选题',multiple:'多选题',judge:'判断题'};
async function load(){try{const r=await fetch('data/questions.json');const d=await r.json();questions=d.questions||[];localStorage.setItem(KEY,JSON.stringify(questions))}catch(e){questions=JSON.parse(localStorage.getItem(KEY)||'[]')}render()}
function render(){document.getElementById('stats').innerHTML=[['题目总数',questions.length],['单选题',questions.filter(q=>q.type==='single').length],['多选题',questions.filter(q=>q.type==='multiple').length],['判断题',questions.filter(q=>q.type==='judge').length],['错题记录',wrong.size]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('');
document.getElementById('nav').innerHTML=categories.map(x=>'<button class="'+(mode===x[0]?'active':'')+'" data-mode="'+x[0]+'">'+x[1]+'</button>').join('')+'<button class="'+(mode==='wrong'?'active':'')+'" data-mode="wrong">错题记录</button><button class="'+(mode==='video'?'active':'')+'" data-mode="video">视频入口</button><button class="'+(mode==='import'?'active':'')+'" data-mode="import">批量导入</button>';
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});const c=document.getElementById('content');if(mode==='video'){c.innerHTML='<div class="panel"><h2>视频入口</h2><p class="muted">视频文件尚未随本仓库导入。后续可将 MP4 放入 <code>videos/</code>，再在 <code>data/questions.json</code> 的 <code>videos</code> 数组登记标题和路径。</p><a class="button primary" href="videos/">打开视频目录</a></div>';return}if(mode==='import'){c.innerHTML='<div class="panel"><h2>批量导入位置</h2><p>请按模板准备 JSON，再替换仓库中的 <code>data/questions.json</code>。浏览器端暂不自动覆盖线上文件。</p><div class="notice">答案字段请使用 <code>answerStatus: "verified"</code> 或 <code>"pending_review"</code>。只有经过核验的答案才能标记 verified。</div><p><a class="button primary" href="data/import/questions.template.json">下载 JSON 模板</a></p></div>';return}let list=mode==='wrong'?questions.filter(q=>wrong.has(q.id)):mode==='all'?questions:questions.filter(q=>q.type===mode);c.innerHTML='<div class="panel"><h2>'+(mode==='wrong'?'错题记录':categories.find(x=>x[0]===mode)[1])+'</h2>'+(list.length?list.map(card).join(''):'<div class="empty">暂无可显示题目。请先导入已核验或待复核的真实题目。</div>')+'</div>';document.querySelectorAll('[data-wrong]').forEach(b=>b.onclick=()=>{const id=b.dataset.wrong;if(wrong.has(id))wrong.delete(id);else wrong.add(id);localStorage.setItem(WRONG,JSON.stringify([...wrong]));render()})}
function card(q){const status=q.answerStatus==='verified'?'<span class="badge" style="background:#e7f6ef;color:#13795b">已核验</span>':'<span class="badge">待复核</span>';const ans=q.answer?'<div class="answer">当前答案：'+q.answer+'（'+(q.answerStatus==='verified'?'已核验':'待复核，不能视为正式标准答案')+'）</div>':'<div class="muted">答案：未提供</div>';return '<article class="q"><div>'+status+'<span class="badge">'+(typeLabel[q.type]||'未分类')+'</span><strong>'+escapeHtml(q.question)+'</strong></div><div class="muted">'+(q.options||[]).map(escapeHtml).join('　')+'</div>'+ans+'<button data-wrong="'+q.id+'">'+(wrong.has(q.id)?'移出错题':'记为错题')+'</button></article>'}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
