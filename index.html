<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>刘志鹏大帅哥</title>
  <style>
    :root{--ink:#fff;--muted:#ffd9e7;--pink:#ff3d81;--violet:#6d28d9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 10%,#ff9a9e 0,#ff6a88 22%,transparent 48%),linear-gradient(135deg,#24104f,#7c2d92 58%,#ec4899)}
    .glow{position:fixed;inset:-20%;background:conic-gradient(from 45deg,transparent,rgba(255,255,255,.12),transparent 30%);animation:spin 18s linear infinite}
    .card{position:relative;width:min(92vw,680px);padding:52px 28px 40px;text-align:center;border:1px solid rgba(255,255,255,.35);border-radius:32px;background:rgba(32,10,60,.42);box-shadow:0 24px 90px rgba(22,4,47,.45);backdrop-filter:blur(14px)}
    .crown{font-size:58px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));animation:bob 2.2s ease-in-out infinite}
    h1{margin:12px 0 8px;font-size:clamp(42px,10vw,82px);letter-spacing:.06em;text-shadow:0 8px 0 rgba(91,23,103,.35),0 0 28px rgba(255,255,255,.35)}
    p{margin:0 auto 26px;max-width:28em;color:var(--muted);font-size:clamp(16px,3vw,20px)}
    .badge{display:inline-block;padding:10px 18px;border-radius:999px;background:linear-gradient(90deg,#ff77a8,#ffd166);color:#4b103b;font-weight:800}
    button{margin-top:26px;border:0;border-radius:999px;padding:13px 22px;color:#fff;background:var(--pink);font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(255,61,129,.38)}
    button:active{transform:scale(.97)}
    #toast{height:28px;margin-top:16px;color:#fff2b5;font-weight:700}
    footer{position:fixed;bottom:16px;font-size:12px;color:rgba(255,255,255,.7)}
    @keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}} @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="crown">👑</div>
    <h1>刘志鹏大帅哥</h1>
    <p>经过全网认真审核，颜值、气质、魅力全部通过，今天也要继续帅下去！</p>
    <span class="badge">帅气值：∞</span><br>
    <button id="btn">点击领取今日帅气</button>
    <div id="toast" aria-live="polite"></div>
  </main>
  <footer>Made with admiration · GitHub Pages</footer>
  <script>
    const lines=["帅气已到账！","魅力暴击 +10086！","今天的主角就是你！","全场最佳，实至名归！"];
    document.getElementById("btn").onclick=()=>{document.getElementById("toast").textContent=lines[Math.floor(Math.random()*lines.length)]};
  </script>
</body>
</html>
